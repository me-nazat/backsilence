name: Scheduled Maintenance Jobs

on:
  schedule:
    # Run daily at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Pending Replays
        run: node scripts/verify-replays.mjs
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          ADMIN_JOB_TOKEN: ${{ secrets.ADMIN_JOB_TOKEN }}

      - name: Crown Weekly & Daily Champions
        run: node scripts/crown-champions.mjs
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          ADMIN_JOB_TOKEN: ${{ secrets.ADMIN_JOB_TOKEN }}

      - name: Database Cleanup (Stale Rooms, Signals, Nonces)
        run: node scripts/cleanup.mjs
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          ADMIN_JOB_TOKEN: ${{ secrets.ADMIN_JOB_TOKEN }}
